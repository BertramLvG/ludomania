<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LudoMania — Design Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   LudoMania design reference — plain HTML/CSS/JS.
   All colors are CSS custom properties. Night is the default
   theme; [data-theme="day"] overrides it. See DESIGN.md.
   ========================================================== */

:root,
[data-theme="night"] {
  --page: #0D1019;
  --text: #EEF0F6;
  --muted: #A3AAC2;
  --panel: #181C2B;
  --panel-shadow: inset 0 -4px 0 rgba(0,0,0,0.35);
  --line: #2A3047;
  --frame: #1F2438;
  --frame-shadow: inset 0 -8px 0 rgba(0,0,0,0.4), 0 0 0 1px #2A3047, 0 24px 60px rgba(0,0,0,0.55);
  --cell: #30375A;
  --cell-shadow: inset 0 -3px 0 rgba(0,0,0,0.32);
  --star: #5B6488;
  --home-inner: #161A2A;
  --slot: #242A44;
  --center: #161A2A;
  --pip: #EEF0F6;
  --dice-bg: #232942;
  --dot: #3A4162;
  --send-bg: #EEF0F6;
  --send-ink: #0D1019;
  --track: #232942;
  --track-icon: #6F789C;
  --knob: #3A4270;
  --token-drop: #121524;

  --red: #F0504C;
  --green: #33B86A;
  --yellow: #F8C630;
  --blue: #3B7CF0;

  --red-tint: rgba(240,80,76,0.16);
  --green-tint: rgba(51,184,106,0.16);
  --yellow-tint: rgba(248,198,48,0.14);
  --blue-tint: rgba(59,124,240,0.18);
}

[data-theme="day"] {
  --page: #F4F5F8;
  --text: #1B1F2E;
  --muted: #5A6178;
  --panel: #FFFFFF;
  --panel-shadow: inset 0 -4px 0 rgba(27,31,46,0.07);
  --line: #E3E6ED;
  --frame: #1E2335;
  --frame-shadow: inset 0 -8px 0 rgba(0,0,0,0.25), 0 20px 50px rgba(30,35,53,0.25);
  --cell: #FFFFFF;
  --cell-shadow: inset 0 -3px 0 rgba(27,31,46,0.10);
  --star: #D5D9E3;
  --home-inner: #FFFFFF;
  --slot: #EEF0F4;
  --center: #FFFFFF;
  --pip: #1B1F2E;
  --dice-bg: #FFFFFF;
  --dot: #D5D9E3;
  --send-bg: #1E2335;
  --send-ink: #FFFFFF;
  --track: #DDE1EA;
  --track-icon: #8A91A8;
  --knob: #FFFFFF;
  --token-drop: #141828;

  --red: #E8433F;
  --green: #2BA55D;
  --yellow: #F6BE1A;
  --blue: #2C6FE6;

  --red-tint: #FDECEB;
  --green-tint: #E6F5EC;
  --yellow-tint: #FEF6DC;
  --blue-tint: #E7EFFD;
}

/* Theme-independent tokens */
:root {
  /* Roll-button fills (darker so white text passes contrast) */
  --red-btn: #C62F2B;   --red-ink: #FFFFFF;
  --green-btn: #1D7F45; --green-ink: #FFFFFF;
  --yellow-btn: #F6BE1A; --yellow-ink: #1B1F2E;
  --blue-btn: #1F5BC2;  --blue-ink: #FFFFFF;

  --cell-radius: 9px;                              /* the "softness" lever */
  --home-radius: calc(var(--cell-radius) * 3 + 4px);
  --home-inner-radius: calc(var(--cell-radius) * 2 + 4px);
  --center-radius: calc(var(--cell-radius) + 4px);
  --board-gap: 4px;

  --ease: 0.35s ease;
  --font: 'Bricolage Grotesque', system-ui, sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  transition: background-color var(--ease), color var(--ease);
}

.app { max-width: 1160px; margin: 0 auto; padding: 28px 24px 40px; display: flex; flex-direction: column; gap: 24px; }

/* ---------- Header ---------- */
.header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-name { font-weight: 800; font-size: 34px; letter-spacing: -1px; }
.brand-dots { display: flex; gap: 4px; }
.brand-dots span { width: 10px; height: 10px; border-radius: 3px; }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nav-link {
  height: 44px; padding: 0 18px; display: flex; align-items: center;
  border-radius: 14px; background: var(--panel); color: var(--text);
  text-decoration: none; font-weight: 600; font-size: 15px; box-shadow: var(--panel-shadow);
  transition: background-color var(--ease), color var(--ease);
}

/* ---------- Day/Night switch ---------- */
.theme-switch {
  height: 44px; padding: 0 4px; border: 0; background: transparent; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font: 600 14px var(--font);
}
.theme-switch .track {
  position: relative; width: 72px; height: 38px; border-radius: 999px;
  background: var(--track); box-shadow: inset 0 3px 0 rgba(0,0,0,0.12);
  transition: background-color var(--ease);
}
.theme-switch .track-icon { position: absolute; top: 12px; width: 14px; height: 14px; stroke: var(--track-icon); }
.theme-switch .track-icon.sun { left: 12px; }
.theme-switch .track-icon.moon { right: 12px; }
.theme-switch .knob {
  position: absolute; left: 4px; top: 4px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--knob); display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.2);
  transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1), background-color var(--ease);
}
.theme-switch[aria-checked="true"] .knob { transform: translateX(34px); }
.theme-switch .knob-sun, .theme-switch .knob-moon { display: none; }
.theme-switch[aria-checked="true"] .knob-moon { display: block; }
.theme-switch[aria-checked="false"] .knob-sun { display: block; }
.theme-switch:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 999px; }

/* ---------- Layout ---------- */
.main { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.board-wrap { flex: 1 1 560px; max-width: 700px; min-width: 0; }
.side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* ---------- Board ---------- */
.board-frame {
  background: var(--frame); border-radius: 40px; padding: 20px; box-shadow: var(--frame-shadow);
  transition: background-color var(--ease);
}
.board { position: relative; width: 100%; aspect-ratio: 1; }
.grid {
  position: absolute; inset: 0; display: grid; gap: var(--board-gap);
  grid-template-columns: repeat(15, minmax(0, 1fr));
  grid-template-rows: repeat(15, minmax(0, 1fr));
}
.cell {
  background: var(--cell); border-radius: var(--cell-radius); box-shadow: var(--cell-shadow);
  display: flex; align-items: center; justify-content: center;
  transition: background-color var(--ease);
}
.cell.lane { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); }
.cell.red { background: var(--red); }
.cell.green { background: var(--green); }
.cell.yellow { background: var(--yellow); }
.cell.blue { background: var(--blue); }
.cell svg { width: 60%; height: 60%; fill: var(--star); }

/* Base (home yard) — 6x6 corner blocks */
.base {
  position: absolute; width: calc(40% - var(--board-gap)); height: calc(40% - var(--board-gap));
  padding: 3.4%; border-radius: var(--home-radius); box-shadow: inset 0 -6px 0 rgba(0,0,0,0.16);
}
.base.red    { left: 0; top: 0; background: var(--red); }
.base.green  { left: calc(60% + var(--board-gap)); top: 0; background: var(--green); }
.base.yellow { left: calc(60% + var(--board-gap)); top: calc(60% + var(--board-gap)); background: var(--yellow); }
.base.blue   { left: 0; top: calc(60% + var(--board-gap)); background: var(--blue); }
.base-inner {
  width: 100%; height: 100%; padding: 13%; border-radius: var(--home-inner-radius);
  background: var(--home-inner); box-shadow: inset 0 4px 0 rgba(0,0,0,0.10);
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12%;
  transition: background-color var(--ease);
}
.slot {
  aspect-ratio: 1; align-self: center; border-radius: 30%; background: var(--slot);
  display: flex; align-items: center; justify-content: center;
}

/* Center home triangle */
.center {
  position: absolute; left: 40%; top: 40%;
  width: calc(20% - var(--board-gap)); height: calc(20% - var(--board-gap));
  border-radius: var(--center-radius); overflow: hidden;
}
.center svg { width: 100%; height: 100%; display: block; }

/* Tokens */
.token {
  border-radius: 50%;
  box-shadow: inset 0 0 0 4px rgba(255,255,255,0.55), inset 0 -4px 0 rgba(0,0,0,0.2);
}
.slot .token { width: 70%; height: 70%; }
.token-on-board {
  position: absolute; width: calc(100% / 15); height: calc(100% / 15);
  display: flex; align-items: center; justify-content: center;
}
.token-on-board .token {
  width: 78%; height: 78%;
  box-shadow: inset 0 0 0 4px rgba(255,255,255,0.55), inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 0 var(--token-drop);
}
.token.red { background: var(--red); }
.token.green { background: var(--green); }
.token.yellow { background: var(--yellow); }
.token.blue { background: var(--blue); }

/* ---------- Side panel ---------- */
.card {
  background: var(--panel); border-radius: 28px; box-shadow: var(--panel-shadow);
  transition: background-color var(--ease);
}
.turn-card { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.turn-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.turn-name { font-weight: 800; font-size: 26px; letter-spacing: -0.5px; }
.turn-swatch { width: 40px; height: 40px; border-radius: 12px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); }
.turn-row { display: flex; align-items: center; gap: 18px; }

.dice {
  width: 112px; height: 112px; flex: none; padding: 20px; border-radius: 28px;
  background: var(--dice-bg); border: 2px solid var(--line); box-shadow: inset 0 -6px 0 var(--line);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
}
.pip { border-radius: 50%; background: var(--pip); opacity: 0; }
.pip.on { opacity: 1; }
.dice.rolling { animation: wobble 0.4s ease; }
@keyframes wobble { 0%{transform:rotate(0)} 30%{transform:rotate(-12deg) scale(0.94)} 60%{transform:rotate(10deg)} 100%{transform:rotate(0)} }

.roll-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.roll-btn {
  width: 100%; height: 56px; border: 0; border-radius: 18px; cursor: pointer;
  font: 800 19px var(--font); box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2);
}
.roll-btn:active { transform: translateY(2px); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
.status { font-size: 14px; color: var(--muted); }

.players { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.player { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; transition: background-color var(--ease); }
.player-badge {
  width: 40px; height: 40px; flex: none; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
}
.player-info { flex: 1; min-width: 0; }
.player-name { font-weight: 600; font-size: 16px; }
.player-sub { font-size: 13px; color: var(--muted); }
.home-dots { display: flex; gap: 3px; }
.home-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }

.chat { display: flex; gap: 8px; }
.chat input {
  flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 2px solid var(--line); border-radius: 16px;
  background: var(--panel); color: var(--text); font: 400 15px var(--font);
}
.chat input::placeholder { color: var(--muted); }
.chat button {
  width: 48px; height: 48px; border: 0; border-radius: 16px; cursor: pointer;
  background: var(--send-bg); color: var(--send-ink); display: flex; align-items: center; justify-content: center;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <span class="brand-name">LudoMania</span>
      <span class="brand-dots" aria-hidden="true">
        <span style="background: var(--red)"></span>
        <span style="background: var(--green)"></span>
        <span style="background: var(--yellow)"></span>
        <span style="background: var(--blue)"></span>
      </span>
    </div>
    <nav class="nav" aria-label="Game">
      <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="true" aria-label="Night mode">
        <span id="themeLabel">Night</span>
        <span class="track">
          <svg class="track-icon sun" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="track-icon moon" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <span class="knob">
            <svg class="knob-moon" width="16" height="16" viewBox="0 0 24 24" fill="#C9D3FF" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="knob-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0A300" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="#F6BE1A"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </span>
        </span>
      </button>
      <a class="nav-link" href="#">Rules</a>
      <a class="nav-link" href="#">Leave game</a>
    </nav>
  </header>

  <main class="main">
    <section class="board-wrap" aria-label="Board">
      <div class="board-frame">
        <div class="board" id="board">
          <div class="grid" id="grid"></div>
          <!-- bases, center and tokens are injected by JS below -->
        </div>
      </div>
    </section>

    <aside class="side" aria-label="Game panel">
      <div class="card turn-card">
        <div class="turn-head">
          <div>
            <div class="eyebrow">Now playing</div>
            <div class="turn-name" id="turnName">Player 1</div>
          </div>
          <span class="turn-swatch" id="turnSwatch"></span>
        </div>
        <div class="turn-row">
          <div class="dice" id="dice" role="img" aria-label="Dice showing 6"></div>
          <div class="roll-col">
            <button class="roll-btn" id="rollBtn">Roll</button>
            <div class="status" id="status" aria-live="polite">Tap Roll to start</div>
          </div>
        </div>
      </div>

      <div class="card players" id="players"></div>

      <div class="chat">
        <label for="chat" class="sr-only">Message</label>
        <input id="chat" type="text" placeholder="Say something nice…">
        <button aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </aside>
  </main>
</div>

<script>
/* ==========================================================
   Board geometry (0-indexed row, col on a 15x15 grid).
   This is the part to keep when porting — see DESIGN.md.
   ========================================================== */
const COLORS = ['red', 'green', 'yellow', 'blue'];         // turn order, clockwise from top-left
const NAMES = { red: 'Player 1', green: 'Player 2', yellow: 'Player 3', blue: 'Player 4' };
const SAFE = ['8,2', '2,6', '6,12', '12,8'];               // ★ squares
const START = { '6,1': 'red', '1,8': 'green', '8,13': 'yellow', '13,6': 'blue' };

function laneOf(r, c) {                                    // colored home columns + start squares
  if (r === 7 && c >= 1 && c <= 5) return 'red';
  if (c === 7 && r >= 1 && r <= 5) return 'green';
  if (r === 7 && c >= 9 && c <= 13) return 'yellow';
  if (c === 7 && r >= 9 && r <= 13) return 'blue';
  return START[r + ',' + c] || null;
}

const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8-4.3-4.1 5.9-.8z"/></svg>';

function buildBoard() {
  const grid = document.getElementById('grid');
  const board = document.getElementById('board');

  // Track cells: the cross (rows 6-8 or cols 6-8), minus the 3x3 center.
  for (let r = 0; r < 15; r++) {
    for (let c = 0; c < 15; c++) {
      const inCross = (r >= 6 && r <= 8) || (c >= 6 && c <= 8);
      const inCenter = r >= 6 && r <= 8 && c >= 6 && c <= 8;
      if (!inCross || inCenter) continue;
      const cell = document.createElement('div');
      const lane = laneOf(r, c);
      cell.className = 'cell' + (lane ? ' lane ' + lane : '');
      cell.style.gridRow = r + 1;
      cell.style.gridColumn = c + 1;
      cell.dataset.r = r; cell.dataset.c = c;
      if (SAFE.includes(r + ',' + c)) cell.innerHTML = STAR_SVG;
      grid.appendChild(cell);
    }
  }

  // Bases: 3 tokens waiting, 1 slot empty (that token is on the board).
  COLORS.forEach(color => {
    const base = document.createElement('div');
    base.className = 'base ' + color;
    const inner = document.createElement('div');
    inner.className = 'base-inner';
    for (let i = 0; i < 4; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (i < 3) slot.innerHTML = '<div class="token ' + color + '"></div>';
      inner.appendChild(slot);
    }
    base.appendChild(inner);
    board.appendChild(base);
  });

  // Center: four triangles pointing in, each player's color on its side.
  const center = document.createElement('div');
  center.className = 'center';
  center.innerHTML =
    '<svg viewBox="0 0 30 30" preserveAspectRatio="none" aria-hidden="true">' +
    '<polygon points="0,0 15,15 0,30" fill="var(--red)"/>' +
    '<polygon points="0,0 30,0 15,15" fill="var(--green)"/>' +
    '<polygon points="30,0 30,30 15,15" fill="var(--yellow)"/>' +
    '<polygon points="0,30 30,30 15,15" fill="var(--blue)"/>' +
    '<rect x="11" y="11" width="8" height="8" rx="2.5" fill="var(--center)" transform="rotate(45 15 15)"/>' +
    '</svg>';
  board.appendChild(center);

  // Sample tokens on the track (position = col/15, row/15 of the board).
  [{ r: 6, c: 3, k: 'red' }, { r: 3, c: 8, k: 'green' }, { r: 8, c: 11, k: 'yellow' }, { r: 11, c: 6, k: 'blue' }]
    .forEach(p => {
      const t = document.createElement('div');
      t.className = 'token-on-board';
      t.style.left = (p.c * 100 / 15) + '%';
      t.style.top = (p.r * 100 / 15) + '%';
      t.innerHTML = '<div class="token ' + p.k + '"></div>';
      board.appendChild(t);
    });
}

/* ---------- Dice ---------- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const diceEl = document.getElementById('dice');
for (let i = 0; i < 9; i++) diceEl.appendChild(Object.assign(document.createElement('div'), { className: 'pip' }));
function showDice(n) {
  [...diceEl.children].forEach((pip, i) => pip.classList.toggle('on', PIPS[n].includes(i)));
  diceEl.setAttribute('aria-label', 'Dice showing ' + n);
}

/* ---------- Turn + players ---------- */
let turn = 0;
function renderTurn() {
  const color = COLORS[turn];
  document.getElementById('turnName').textContent = NAMES[color];
  document.getElementById('turnSwatch').style.background = 'var(--' + color + ')';
  const btn = document.getElementById('rollBtn');
  btn.style.background = 'var(--' + color + '-btn)';
  btn.style.color = 'var(--' + color + '-ink)';
  document.getElementById('players').innerHTML = COLORS.map((k, i) =>
    '<div class="player" style="background:' + (i === turn ? 'var(--' + k + '-tint)' : 'transparent') + '">' +
      '<div class="player-badge" style="background:var(--' + k + ');color:var(--' + k + '-ink)">' + (i + 1) + '</div>' +
      '<div class="player-info"><div class="player-name">' + NAMES[k] + '</div>' +
      '<div class="player-sub">3 in base · 1 on board</div></div>' +
      '<div class="home-dots" role="img" aria-label="Tokens home: 0 of 4"><span></span><span></span><span></span><span></span></div>' +
    '</div>'
  ).join('');
}

document.getElementById('rollBtn').addEventListener('click', () => {
  const d = 1 + Math.floor(Math.random() * 6);
  const roller = COLORS[turn];
  diceEl.classList.remove('rolling'); void diceEl.offsetWidth; diceEl.classList.add('rolling');
  showDice(d);
  document.getElementById('status').textContent = NAMES[roller] + ' rolled ' + d + (d === 6 ? ' — go again!' : '');
  if (d !== 6) turn = (turn + 1) % 4;
  renderTurn();
});

/* ---------- Day / Night ---------- */
// Always starts in night mode (product decision). The slider switches for the session.
const themeSwitch = document.getElementById('themeSwitch');
function setTheme(night) {
  document.documentElement.dataset.theme = night ? 'night' : 'day';
  themeSwitch.setAttribute('aria-checked', String(night));
  document.getElementById('themeLabel').textContent = night ? 'Night' : 'Day';
}
themeSwitch.addEventListener('click', () => setTheme(themeSwitch.getAttribute('aria-checked') !== 'true'));

buildBoard();
showDice(6);
renderTurn();
setTheme(true);
</script>
