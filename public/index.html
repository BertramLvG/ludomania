<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludomania</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #faf9f5; color: #222; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #bbb; }
  button { background: #222; color: #fff; border-color: #222; cursor: pointer; }
  button:disabled { background: #ccc; border-color: #ccc; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .hidden { display: none; }
  #error { color: #a32d2d; min-height: 1.4em; }
  svg { width: 100%; height: auto; display: block; }
  .coord { font-size: 9px; fill: #555; }
  .movable { cursor: pointer; }
  #die { font-size: 20px; font-weight: 600; min-width: 90px; text-align: center; padding: 6px 12px; border: 2px solid #222; border-radius: 10px; background: #fff; }
  #log { font-size: 14px; color: #444; margin: 0; padding-left: 18px; }
  .players span { display: inline-block; margin-right: 12px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <h1>Ludomania</h1>
  <div id="error"></div>

  <section id="menu" class="card">
    <div class="row"><input id="name" placeholder="Your name" maxlength="20"></div>
    <div class="row">
      <button id="create">Create game</button>
      <input id="code" placeholder="Room code" maxlength="4" size="6">
      <button id="join">Join game</button>
    </div>
    <div class="row"><button id="solo">Play solo against 3 bots</button></div>
  </section>

  <section id="lobby" class="card hidden">
    <div>Room code: <strong id="roomCode"></strong> (share it with your friends)</div>
    <div id="lobbyPlayers" class="row"></div>
    <div class="row">
      <button id="addBot">Add bot</button>
      <button id="removeBot">Remove bot</button>
      <button id="start">Start game</button>
    </div>
    <div id="lobbyHint"></div>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <div id="players" class="players"></div>
      <div class="row">
        <button id="roll">Roll</button>
        <div id="die">-</div>
        <strong id="status"></strong>
      </div>
      <ul id="log"></ul>
    </div>
    <div class="card"><svg id="board" viewBox="0 0 680 640" role="img" aria-label="Ludo board"></svg></div>
  </section>
</main>
<script src="/board.js"></script>
<script src="/boardview.js"></script>
<script src="/app.js"></script>
</body>
</html>
